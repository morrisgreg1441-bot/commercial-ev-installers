name: Weekly data refresh

# Fully autonomous. Every Monday 06:00 UTC GitHub re-scrapes the public OZEV
# data, validates it, sanity-builds the site, and commits the refreshed data.
# Cloudflare Pages (Git integration) then rebuilds and deploys automatically
# from that commit. No local machine, no secrets in this workflow.
#
# Generated output (site/dist) is intentionally NOT committed — Cloudflare
# rebuilds it on every push, so the repo stays small and churn-free.

on:
  # Weekly refresh disabled 11 Sep 2026: the project is closed and the domain
  # commercialevinstallers.co.uk is no longer registered, so this was rebuilding
  # data nobody reads. Left in place, commented out, so it can be revived by
  # uncommenting rather than rewritten from scratch.
  # schedule:
  #   - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape public OZEV data
        run: python pipeline/extract.py

      - name: Validate dataset (blocks publish on failure)
        run: python pipeline/validate.py

      - name: Sanity-build the site (gate — output not committed)
        run: python site/generate.py

      - name: Commit refreshed data
        run: |
          git config user.name  "ev-directory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "Auto-refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
      # The push above triggers Cloudflare Pages to rebuild & deploy.
