name: Weekly data refresh + rebuild

# Fully autonomous: every Monday 06:00 UTC GitHub re-scrapes the public OZEV
# data, validates it, rebuilds the static site, and commits. GitHub Pages (or a
# Cloudflare Pages git integration) then auto-deploys. No local machine needed.
# Manual run also available from the Actions tab.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape public OZEV data
        run: python pipeline/extract.py

      - name: Validate dataset (blocks publish on failure)
        run: python pipeline/validate.py

      - name: Rebuild static site
        run: python site/generate.py

      - name: Commit refreshed data + site
        run: |
          git config user.name  "ev-directory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes this run."
          else
            git commit -m "Auto-refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy-pages:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
