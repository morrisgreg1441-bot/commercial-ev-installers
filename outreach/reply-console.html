<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reply templates</title>
<style>
  :root{--bg:#0d0f12;--panel:#15181d;--panel2:#1b1f26;--bd:#262b33;--ink:#e7eaee;
    --ink2:#aab2bd;--mut:#727a86;--green:#3dd68c;--green-d:#2bb673;--blue:#6f8fbf;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  a{color:var(--green)}
  .wrap{max-width:860px;margin:0 auto;padding:26px 20px 80px}
  h1{font-size:23px;font-weight:800;letter-spacing:-.5px;margin:0 0 4px}
  .sub{color:var(--ink2);margin:0 0 20px;font-size:14px}
  .controls{position:sticky;top:0;background:var(--bg);padding:12px 0 14px;
    border-bottom:1px solid var(--bd);margin-bottom:18px;z-index:5}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text]{flex:1;min-width:180px;background:var(--panel2);
    border:1px solid var(--bd);color:var(--ink);border-radius:8px;
    padding:9px 12px;font:inherit;font-size:14px}
  .namebox{max-width:230px}
  .seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;flex-wrap:wrap}
  .seg button{background:var(--panel);color:var(--ink2);border:0;padding:7px 12px;
    font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--panel2);color:var(--ink)}
  .sechead{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;
    color:var(--mut);font-weight:700;margin:24px 0 4px}
  .secintro{color:var(--ink2);font-size:13px;margin:0 0 10px}
  .card{background:var(--panel);border:1px solid var(--bd);border-radius:11px;
    padding:14px 16px;margin-bottom:12px}
  .ct{font-size:14.5px;font-weight:700;margin:0 0 9px;color:var(--ink)}
  .ct strong{color:var(--green)}
  .msg{background:var(--panel2);border:1px solid var(--bd);border-radius:8px;
    padding:12px 13px;white-space:pre-wrap;font-size:13.5px;color:var(--ink2);
    margin-bottom:10px}
  .msg .ph{background:rgba(232,84,91,.20);color:#ffb4b4;border-radius:3px;padding:0 3px}
  .note{font-size:12.5px;color:var(--mut);font-style:italic;margin:0 0 10px}
  .btn{border:0;border-radius:8px;padding:8px 15px;font:inherit;font-size:13px;
    font-weight:600;cursor:pointer;background:var(--green);color:#04130b}
  .btn:hover{background:var(--green-d)}
  .empty{color:var(--mut);text-align:center;padding:40px}
  .hint{color:var(--mut);font-size:12px;margin-top:6px}
</style></head><body>
<div class="wrap">
  <h1>Reply templates</h1>
  <p class="sub">When a reply lands: find the right one, hit Copy, paste into your
    reply, fill the <span style="color:#ffb4b4">[highlighted]</span> bits, send.</p>

  <div class="controls">
    <div class="row">
      <input type="text" id="q" placeholder="Search templates… (e.g. traffic, scam, scope, remove)">
      <input type="text" id="name" class="namebox" placeholder="Your name (signoff)">
    </div>
    <div class="row" id="filter" style="margin-top:10px"></div>
    <div class="hint">Recipient-specific bits like [Name]/[Org] stay as placeholders — fill them per reply.</div>
  </div>

  <div id="list"></div>
</div>
<script>
const T = [{"section": "TRADE BODY replies (your money path — chase the call)", "title": "\"Tell me more\" / \"Sounds interesting\"", "body": "Hi [Name],\nThanks for getting back. Quickest way to show you is a 15–20 min call — I'll walk you through a working example I've built and we'll see if a directory makes sense for [Org]. Easier than me writing an essay.\nDoes Thursday or Friday this week suit? Or send me a couple of times and I'll work around you.\nEither way, here's the example to look at first: https://commercial-ev-installers.pages.dev\nBest, Greg", "note": ""}, {"section": "TRADE BODY replies (your money path — chase the call)", "title": "\"Send the scope\" → one-page scope email", "body": "Subject: One-page scope — directory for [Org]\nHi [Name],\nAs promised, kept to one page.\n**What it is:** A searchable [niche] directory, on your own domain.\n**What you get:** [~N listings seeded by me] · search + filter by [region × category] · your branding · a \"submit a listing\" route so members self-add.\n**What I need from you:** [your member list / logo / sign-off on categories].\n**Timeline:** [2–3 weeks] from the day I have your data and domain.\n**Price:** £[750–1,500] one-off. 50% to start, 50% on delivery. You own the code and domain.\n**Working example:** https://commercial-ev-installers.pages.dev — click around.\nHappy to talk it through — does [day] work?\nBest, Greg", "note": ""}, {"section": "TRADE BODY replies (your money path — chase the call)", "title": "\"What's the catch / who are you\"", "body": "Hi [Name], no catch. I'm a UK developer who builds niche directories. For [Org] I'd build [one line]. One-off build, £[750–1,500], and here's a live example so you can judge the quality yourself: https://commercial-ev-installers.pages.dev. Happy to send a one-page scope or jump on a 15-min call — whichever's easier. Best, Greg", "note": ""}, {"section": "TRADE BODY replies (your money path — chase the call)", "title": "\"We already have something\"", "body": "Hi [Name], makes sense — most orgs have *a* members list. The real question is whether it pulls in search traffic and gives members a reason to share it. What have you got currently? If it's already doing that, I'll happily leave you be. If not, that's exactly the gap I fill — here's what I mean: https://commercial-ev-installers.pages.dev. Best, Greg", "note": ""}, {"section": "TRADE BODY replies (your money path — chase the call)", "title": "\"We'll build it ourselves\"", "body": "Hi [Name], honestly you could — it's not rocket science. The question is whether it's worth your team's weeks versus a fixed £[X] and live in two. I've already built the engine, so you'd be paying for speed, not for someone to learn on your time. Here's the standard it lands at: https://commercial-ev-installers.pages.dev. Best, Greg", "note": ""}, {"section": "TRADE BODY replies (your money path — chase the call)", "title": "\"Send references\" (you have one portfolio piece — be honest)", "body": "Hi [Name], I'll be straight: I'm early, so you'd be one of my first builds in your niche. Instead of a wall of logos, two things — (1) the actual work, live: https://commercial-ev-installers.pages.dev, and (2) I de-risk it for you: 50% to start, the second 50% only once it's delivered and you're happy. If it's not right, you don't pay the balance. Best, Greg", "note": ""}, {"section": "TRADE BODY replies (your money path — chase the call)", "title": "\"Not now / circle back later\"", "body": "Hi [Name], no problem at all. Want me to check back in [month]? I'll keep the example handy. Best, Greg", "note": "Then log the date."}, {"section": "INSTALLER replies (£99 — keep it fast and async, never push a call)", "title": "\"How much traffic do you have?\" (the make-or-break one)", "body": "Hi [Name], straight answer: the site's new, so I won't quote you a big traffic number — it'd be nonsense. What £99 buys is an early Featured slot before the directory fills up: top placement in your area, your full listing with your link, locked at this price for 12 months while I do the SEO work to grow it. If you're not happy in the first 30 days, full refund, no questions. So the downside is genuinely capped. Your listing while it's small: https://commercial-ev-installers.pages.dev/featured/. Best, Greg", "note": ""}, {"section": "INSTALLER replies (£99 — keep it fast and async, never push a call)", "title": "\"Is this a scam / is this legit?\"", "body": "Hi [Name], fair question — I'd be wary of a cold email too. I'm Greg, a UK sole trader. The directory's real and live: https://commercial-ev-installers.pages.dev. Payment is through Stripe (the same checkout millions of businesses use), and there's a 30-day full refund. No subscription, no auto-renew — £99 for 12 months, that's it. Best, Greg", "note": ""}, {"section": "INSTALLER replies (£99 — keep it fast and async, never push a call)", "title": "\"Interested, how do I pay?\"", "body": "Hi [Name], great — here's the page with the secure checkout: https://commercial-ev-installers.pages.dev/featured/. Takes about two minutes. Once you're through, send me your logo and the URL you want listed and I'll have you live the same day. Best, Greg", "note": ""}, {"section": "INSTALLER replies (£99 — keep it fast and async, never push a call)", "title": "\"I'll think about it\"", "body": "Hi [Name], of course. Only thing I'd flag: the £99 is an early-listing price and it's first-come for your area. No pressure — and the 30-day refund means there's no real risk in deciding now: https://commercial-ev-installers.pages.dev/featured/. Best, Greg", "note": ""}, {"section": "INSTALLER replies (£99 — keep it fast and async, never push a call)", "title": "\"Remove me / unsubscribe / stop\" (action immediately, then this one line)", "body": "Hi [Name], done — removed, and you won't hear from me again. Apologies for the intrusion. Best, Greg", "note": "Add their address to `data/suppress.txt` and never email again — PECR duty."}, {"section": "Follow-ups (no reply)", "title": "Day-4 nudge (either path)", "body": "Hi [Name], just bumping this up your inbox in case it got buried — any thoughts? Happy to answer anything. Best, Greg", "note": ""}, {"section": "Follow-ups (no reply)", "title": "Break-up (trade body, ~day 10)", "body": "Hi [Name], I'll assume the timing isn't right and stop emailing — no worries at all. If a directory's ever useful, the example's here: https://commercial-ev-installers.pages.dev. All the best, Greg", "note": ""}, {"section": "Follow-ups (no reply)", "title": "Warm lead gone quiet — +3 days", "body": "Hi [Name], just bumping this — any questions on the scope? Happy to jump on a quick call. Best, Greg", "note": ""}, {"section": "Follow-ups (no reply)", "title": "Warm lead gone quiet — +7 days", "body": "Hi [Name], I'll leave it with you rather than keep chasing — drop me a line whenever you're ready. Best, Greg", "note": ""}];
const LS="reply-console-name";
const $=id=>document.getElementById(id);
const nameEl=$("name"); nameEl.value=localStorage.getItem(LS)||"";
let section="all", query="";

const sections=[...new Set(T.map(t=>t.section))];
const fbar=$("filter");
function mkBtn(label,val){const b=document.createElement("button");b.textContent=label;
  b.dataset.f=val;if(val==="all")b.classList.add("on");
  b.onclick=()=>{section=val;[...fbar.children].forEach(x=>x.classList.remove("on"));
    b.classList.add("on");render();};return b;}
const seg=document.createElement("div");seg.className="seg";
seg.appendChild(mkBtn("All","all"));
sections.forEach(s=>seg.appendChild(mkBtn(s.replace(/ replies.*| \(.*/,""),s)));
fbar.appendChild(seg);

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function sub(s){const n=nameEl.value.trim();return n?s.split("Greg").join(n):s;}
function inlineMd(s){s=esc(s);s=s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  return s;}
function hl(s){let h=esc(sub(s));
  h=h.replace(/\[(.+?)\]/g,'<span class="ph">[$1]</span>');return h;}

function render(){
  const list=$("list");list.innerHTML="";
  let lastSec=null,shown=0;
  T.forEach((t,i)=>{
    if(section!=="all"&&t.section!==section)return;
    const hay=(t.title+" "+t.body+" "+t.section).toLowerCase();
    if(query&&!hay.includes(query))return;
    shown++;
    if(t.section!==lastSec){const h=document.createElement("div");
      h.className="sechead";h.textContent=t.section;list.appendChild(h);lastSec=t.section;}
    const card=document.createElement("div");card.className="card";
    card.innerHTML=`<p class="ct">${inlineMd(t.title)}</p>
      <div class="msg">${hl(t.body)}</div>
      ${t.note?`<p class="note">${inlineMd(t.note)}</p>`:""}
      <button class="btn">Copy</button>`;
    card.querySelector(".btn").onclick=async ev=>{
      try{await navigator.clipboard.writeText(sub(t.body));
        ev.target.textContent="Copied ✓";setTimeout(()=>ev.target.textContent="Copy",1300);
      }catch(e){alert("Copy failed — select the text manually.");}
    };
    list.appendChild(card);
  });
  if(!shown)list.innerHTML='<div class="empty">No template matches that search.</div>';
}
$("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render();});
nameEl.addEventListener("input",()=>{localStorage.setItem(LS,nameEl.value);render();});
render();
</script></body></html>
